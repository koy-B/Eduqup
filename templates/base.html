<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTutor AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0a0a14;
            --cream: #f5f0e8;
            --gold: #e8b84b;
            --teal: #1a9b8c;
            --surface: #ffffff;
            --surface-2: #f8f6f1;
            --muted: #67677d;
            --border: rgba(10, 10, 20, 0.1);
            --shadow: 0 14px 38px rgba(10, 10, 20, 0.08);
        }
        * { box-sizing: border-box; }
        body {
            font-family: "DM Sans", sans-serif;
            margin: 0;
            background: var(--cream);
            color: var(--ink);
        }
        .nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(245, 240, 232, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .brand {
            font-family: "Syne", sans-serif;
            font-weight: 800;
            text-decoration: none;
            color: var(--ink);
            font-size: 20px;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .nav-links a {
            text-decoration: none;
            color: var(--ink);
            padding: 8px 12px;
            border-radius: 10px;
        }
        .nav-links a:hover { background: var(--surface); }
        .nav-inline-form { margin: 0; }
        .nav-inline-form button {
            width: auto;
            margin: 0;
            padding: 9px 14px;
            font-size: 13px;
        }
        .container {
            max-width: 1120px;
            margin: 24px auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
        }
        .row { display: flex; gap: 16px; flex-wrap: wrap; }
        .card {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            background: var(--surface);
        }
        input, textarea, button {
            width: 100%;
            margin: 8px 0;
            padding: 10px 12px;
            border: 1px solid #d8d6cf;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: "DM Sans", sans-serif;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(26, 155, 140, 0.12);
        }
        button {
            background: var(--ink);
            color: var(--cream);
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: var(--teal); }
        h1, h2, h3 { font-family: "Syne", sans-serif; margin-top: 0; }
        .small { color: var(--muted); font-size: 13px; }
        .msg { padding: 10px; border-radius: 6px; margin: 8px 0; }
        .msg.error { background: #fdebec; color: #842029; }
        .msg.success { background: #ebf8ee; color: #0f5132; }
        .chat-user { background: #eef8f6; padding: 10px; border-radius: 6px; margin: 8px 0; }
        .chat-assistant { background: #f7f4ed; padding: 10px; border-radius: 6px; margin: 8px 0; white-space: pre-wrap; }
        @media (max-width: 780px) {
            .container { margin: 12px; }
            .nav { padding: 12px; }
        }
    </style>
</head>
<body>
<div class="nav">
    <a class="brand" href="/">EduTutor AI</a>
    <div class="nav-links">
        <a href="/pricing/">Pricing</a>
        {% if request.user.is_authenticated %}
            <a href="/dashboard/">Dashboard</a>
            <a href="/documents/upload/">Upload</a>
            <form class="nav-inline-form" action="/logout/" method="post">
                {% csrf_token %}
                <button>Logout</button>
            </form>
        {% else %}
            <a href="/login/">Login</a>
            <a href="/register/">Register</a>
        {% endif %}
    </div>
</div>
<div class="container">
    {% if messages %}
        {% for message in messages %}
            <div class="msg {{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
